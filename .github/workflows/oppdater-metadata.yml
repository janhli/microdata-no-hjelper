name: Oppdater metadata og manual

on:
  schedule:
    - cron: "0 4 * * 1"   # hver mandag kl. 04 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oppdater:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: skills/microdata-no
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent variabelkatalog
        run: python verktoy/hent_variabler.py --alle
      - name: Hent manual
        run: python verktoy/hent_manual.py
      - name: Commit hvis noe er endret
        run: |
          if [ -n "$(git status --porcelain -- metadata)" ]; then
            date -u +%Y-%m-%d > metadata/HENTET
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add metadata
            git commit -m "Oppdater metadata fra microdata.no ($(cat metadata/HENTET))"
            git push
          else
            echo "Ingen endringer."
          fi
